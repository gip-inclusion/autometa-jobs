[project]
name = "autometa-jobs-orchestrator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.9",
    "alembic>=1.20.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "scaleway>=2.12.0",
    "boto3>=1.44.3",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: pip install -r requirements-dev.txt
      - name: Lockfiles in sync with pyproject
        run: |
          for d in orchestrator worker jobsctl; do uv lock --check --directory "$d"; done
      - run: ruff check orchestrator/src worker/src jobsctl/src
      - run: ruff format --check orchestrator/src worker/src jobsctl/src

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: pip install -r requirements-dev.txt

      - name: Bandit (SAST)
        run: bandit -r orchestrator/src worker/src jobsctl/src -c pyproject.toml --severity-level medium --confidence-level high -q

      - name: pip-audit (orchestrator)
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --directory orchestrator -o /tmp/orchestrator-req.txt
          pip-audit -r /tmp/orchestrator-req.txt --strict

      - name: pip-audit (worker)
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --directory worker -o /tmp/worker-req.txt
          pip-audit -r /tmp/worker-req.txt --strict

      - name: pip-audit (jobsctl)
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --directory jobsctl -o /tmp/jobsctl-req.txt
          pip-audit -r /tmp/jobsctl-req.txt --strict

      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . -v

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint (orchestrator)
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
          ./hadolint orchestrator/Dockerfile --failure-threshold error

      - name: Hadolint (worker)
        run: ./hadolint worker/Dockerfile --failure-threshold error

      - name: Build orchestrator
        run: docker build orchestrator/ --tag pipometa-orchestrator:ci

      - name: Build worker
        run: docker build worker/ --tag pipometa-worker:ci

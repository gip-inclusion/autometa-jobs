name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check orchestrator/src worker/src jobsctl/src
      - run: ruff format --check orchestrator/src worker/src jobsctl/src

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt

      - name: Bandit (SAST)
        run: bandit -r orchestrator/src worker/src jobsctl/src -c pyproject.toml --severity-level medium --confidence-level high -q

      - name: pip-audit (orchestrator)
        run: |
          python -m venv /tmp/venv-orch
          /tmp/venv-orch/bin/pip install -q ./orchestrator
          /tmp/venv-orch/bin/pip freeze --exclude autometa-jobs-orchestrator > /tmp/orch-req.txt
          pip-audit -r /tmp/orch-req.txt --strict

      - name: pip-audit (worker)
        run: |
          python -m venv /tmp/venv-worker
          /tmp/venv-worker/bin/pip install -q ./worker
          /tmp/venv-worker/bin/pip freeze --exclude autometa-jobs-worker > /tmp/worker-req.txt
          pip-audit -r /tmp/worker-req.txt --strict

      - name: pip-audit (jobsctl)
        run: |
          python -m venv /tmp/venv-jobsctl
          /tmp/venv-jobsctl/bin/pip install -q ./jobsctl
          /tmp/venv-jobsctl/bin/pip freeze --exclude autometa-jobs-jobsctl > /tmp/jobsctl-req.txt
          pip-audit -r /tmp/jobsctl-req.txt --strict

      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . -v

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Hadolint (orchestrator)
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
          ./hadolint orchestrator/Dockerfile --failure-threshold error

      - name: Hadolint (worker)
        run: ./hadolint worker/Dockerfile --failure-threshold error

      - name: Build orchestrator
        run: docker build orchestrator/ --tag pipometa-orchestrator:ci

      - name: Build worker
        run: docker build worker/ --tag pipometa-worker:ci

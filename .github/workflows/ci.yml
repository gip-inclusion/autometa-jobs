name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PR runs are superseded by newer pushes; main runs are never cancelled so a
# deploy in flight is not interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pip install -r requirements-dev.txt
      - name: Lockfiles in sync with pyproject
        run: |
          for d in orchestrator worker jobsctl; do uv lock --check --directory "$d"; done
      - run: ruff check orchestrator/src worker/src jobsctl/src
      - run: ruff format --check orchestrator/src worker/src jobsctl/src

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pip install -r requirements-dev.txt

      - name: Bandit (SAST)
        run: bandit -r orchestrator/src worker/src jobsctl/src -c pyproject.toml --severity-level medium --confidence-level high -q

      - name: pip-audit (orchestrator)
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --directory orchestrator -o /tmp/orchestrator-req.txt
          pip-audit -r /tmp/orchestrator-req.txt --strict

      - name: pip-audit (worker)
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --directory worker -o /tmp/worker-req.txt
          pip-audit -r /tmp/worker-req.txt --strict

      - name: pip-audit (jobsctl)
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --directory jobsctl -o /tmp/jobsctl-req.txt
          pip-audit -r /tmp/jobsctl-req.txt --strict

      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . -v

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint (orchestrator)
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
          ./hadolint orchestrator/Dockerfile --failure-threshold error

      - name: Hadolint (worker)
        run: ./hadolint worker/Dockerfile --failure-threshold error

      - name: Build orchestrator
        run: docker build orchestrator/ --tag pipometa-orchestrator:ci

      - name: Build worker
        run: docker build worker/ --tag pipometa-worker:ci

  # ---------------------------------------------------------------------------
  # Deploy: on a green main, build the images whose sources changed, push them
  # as :latest and :<sha>, then redeploy the orchestrator. The worker needs no
  # deploy step, its job definition pulls :latest on every run.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed images
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [lint, security, docker]
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          images='[]'
          if echo "$changed" | grep -qE '^(orchestrator/|\.github/workflows/ci\.yml)'; then images='["orchestrator"]'; fi
          if echo "$changed" | grep -qE '^(worker/|\.github/workflows/ci\.yml)'; then images=$(echo "$images" | sed 's/\]$/,"worker"]/; s/^\[,/[/'); fi
          echo "images=$images" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build & push ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: |
            rg.fr-par.scw.cloud/nova-container-registry/pipometa-${{ matrix.image }}:latest
            rg.fr-par.scw.cloud/nova-container-registry/pipometa-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy-orchestrator:
    name: Redeploy orchestrator
    needs: [changes, build]
    if: contains(needs.changes.outputs.images, 'orchestrator')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-orchestrator
      cancel-in-progress: false
    env:
      API: https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers/${{ secrets.PIPOMETA_CONTAINER_ID }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - name: Trigger redeploy
        run: |
          curl -fsS -X POST "$API/deploy" -H "X-Auth-Token: $SCW_SECRET_KEY" -H "Content-Type: application/json" -d '{}' \
            | python3 -c 'import sys,json; print("status:", json.load(sys.stdin)["status"])'
      - name: Wait until ready
        run: |
          for i in $(seq 1 60); do
            out=$(curl -fsS "$API" -H "X-Auth-Token: $SCW_SECRET_KEY")
            status=$(echo "$out" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            echo "status: $status"
            case "$status" in
              ready) echo "$out" | python3 -c 'import sys,json; print("domain=" + json.load(sys.stdin)["domain_name"])' >> "$GITHUB_ENV"; exit 0 ;;
              error) echo "$out" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("error_message"))'; exit 1 ;;
            esac
            sleep 5
          done
          echo "timed out waiting for ready"; exit 1
      - name: Health check
        run: curl -fsS "https://$domain/healthz"

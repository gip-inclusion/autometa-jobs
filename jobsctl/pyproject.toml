[project]
name = "autometa-jobs-jobsctl"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.27",
    "rich>=13.9",
]

[project.scripts]
jobsctl = "jobsctl.cli:cli"

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
